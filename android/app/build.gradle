plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'it.digitalcase.cassa'
    compileSdk 34

    defaultConfig {
        applicationId "it.digitalcase.cassa"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName (System.getenv("VERSION_NAME") ?: "0.1")
    }

    // La chiave di firma arriva dall'ambiente (su GitHub dai segreti del repository):
    // nel repo non c'e' nulla di segreto. Senza chiave si compila lo stesso, non firmato.
    def chiave = System.getenv("KEYSTORE_FILE")
    if (chiave != null && !chiave.isEmpty()) {
        signingConfigs {
            rilascio {
                storeFile file(chiave)
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (chiave != null && !chiave.isEmpty()) {
                signingConfig signingConfigs.rilascio
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
